services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-endpoint_mgmt}
      POSTGRES_USER: ${POSTGRES_USER:-endpoint_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-endpoint_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-endpoint_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-endpoint_mgmt}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      PORT: "${PORT:-8080}"
      GIN_MODE: "${GIN_MODE:-release}"
      JOCKY_AES_KEY: "${JOCKY_AES_KEY}"
      JOCKY_OPERATOR_SECRET: "${JOCKY_OPERATOR_SECRET}"
      JOCKY_ADMIN_PASSWORD: "${JOCKY_ADMIN_PASSWORD}"
      JOCKY_WEBHOOK_SECRET: "${JOCKY_WEBHOOK_SECRET}"
      JOCKY_ATTACKER_IP: "${JOCKY_ATTACKER_IP}"
      JOCKY_ATTACKER_PORT: "${JOCKY_ATTACKER_PORT:-4444}"
      EC2_PUBLIC_IP: "${EC2_PUBLIC_IP}"
      ZONE_FILE_PATH: "${ZONE_FILE_PATH:-/tmp/jocky.online.zone}"
      JOCKY_MAX_RETRIES: "${JOCKY_MAX_RETRIES:-3}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      BUNDLE_PATH: "/app/binaries/bundle.bin"
    volumes:
      - binaries:/app/binaries
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  binaries:
